<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#080e17">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" type="image/png" href="./icons/icon-192.png">
  <title>FLEX/CTRL — Mini</title>
  <style>
    :root{color-scheme:dark;--bg:#080e17;--card:#0e1926;--line:#294050;--text:#e6f4f7;--muted:#7a95a8;--cyan:#78e9df;--mono:'Cascadia Code',Consolas,'Liberation Mono',monospace;--sans:'Segoe UI',Inter,system-ui,sans-serif}
    *{box-sizing:border-box}
    html{min-height:100%}
    body{margin:0;min-width:290px;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:22px;background:radial-gradient(ellipse at 50% -12%,#17414c 0%,#0b1622 35%,#080e17 75%);font-family:var(--sans);color:var(--text);-webkit-font-smoothing:antialiased}
    body:before{content:"";position:fixed;inset:0;pointer-events:none;background:linear-gradient(#7698a207 1px,transparent 1px),linear-gradient(90deg,#7698a207 1px,transparent 1px);background-size:30px 30px}
    .widget{position:relative;overflow:hidden;width:100%;max-width:398px;isolation:isolate;border:1px solid #2a4957;border-radius:19px;background:linear-gradient(153deg,#132435 0%,#0f1b29 45%,#0b1420 100%);box-shadow:0 25px 70px #0007,0 0 0 1px #001016 inset,0 0 65px #1aabb910}
    .widget:before{content:"";position:absolute;pointer-events:none;right:-114px;top:-130px;width:300px;height:300px;border:1px solid #69d1d016;border-radius:50%;box-shadow:0 0 0 34px #69d1d00a,0 0 0 75px #69d1d008}
    .widget:after{content:"";position:absolute;top:0;left:22px;width:77px;height:2px;background:var(--cyan);box-shadow:0 0 20px #78e9df80}
    .inner{position:relative;z-index:1;padding:25px 27px 20px}
    .head{display:flex;align-items:center;justify-content:space-between;gap:12px}
    .brand{display:flex;align-items:center;gap:11px}
    .logo{position:relative;display:grid;place-items:center;width:34px;height:34px;border:1px solid #32747a;border-radius:9px;background:#12363f;color:var(--cyan);box-shadow:0 0 16px #31bdba0c}
    .logo svg{width:19px;height:19px}
    .brandtxt{font-family:var(--mono);font-size:14px;font-weight:700;letter-spacing:-.5px;white-space:nowrap}
    .brandtxt span{color:var(--cyan)}
    .edition{font:9px var(--mono);color:#648595;letter-spacing:1.1px;margin-top:4px}
    .status{font:9px var(--mono);letter-spacing:1px;color:#9dc9cb;white-space:nowrap;display:flex;gap:7px;align-items:center}
    .dot{height:6px;width:6px;background:#80e8d9;border-radius:100%;box-shadow:0 0 10px #80e8d9}
    .rule{height:1px;background:linear-gradient(90deg,#315267,#263b49 75%,transparent);margin:22px 0 25px}
    .sectionlabel{font:10px var(--mono);letter-spacing:1.6px;color:#7c9aa9;display:flex;align-items:center;justify-content:space-between;gap:8px}
    .step{color:var(--cyan)}
    .inputrow{display:flex;gap:10px;margin-top:11px}
    .timeinput{min-width:0;flex:1;outline:none;font:700 31px var(--mono);letter-spacing:1px;font-variant-numeric:tabular-nums;text-align:center;color:#eaf8fa;padding:14px 9px;border:1px solid #365467;background:#0b1622;border-radius:10px;transition:border-color .18s,box-shadow .18s}
    .timeinput:focus{border-color:#65cfcf;box-shadow:0 0 0 3px #37bbbe25}
    .timeinput::-webkit-calendar-picker-indicator{filter:invert(.75) sepia(.15) saturate(2) hue-rotate(132deg);cursor:pointer}
    .nowbtn{min-width:65px;border:1px solid #2c575e;background:#17343e;color:#97ece7;border-radius:9px;font:700 11px var(--mono);letter-spacing:1px;cursor:pointer;transition:background .18s}
    .nowbtn:hover{background:#20515b}
    .nowbtn:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
    .out{margin-top:26px;padding:21px 22px 19px;border:1px solid #2d5962;border-radius:12px;background:radial-gradient(circle at 96% 16%,#1d62643a,transparent 63%),linear-gradient(125deg,#102d37,#10202e 85%);box-shadow:inset 0 1px 0 #7ef8e10a}
    .outtop{display:flex;justify-content:space-between;align-items:center;gap:8px;font:10px var(--mono);letter-spacing:1.1px;color:#9fc3cb}
    .outtop svg{width:18px;height:18px;color:#83dcd8}
    .result{margin:10px 0 5px;color:#91f6e9;font:700 clamp(52px,15vw,70px)/1.13 var(--mono);letter-spacing:-4px;font-variant-numeric:tabular-nums;text-shadow:0 0 32px #5bebdd28;white-space:nowrap}
    .result.placeholder{color:#5a838a}
    .msg{font-size:12px;color:#a3c0c8;min-height:16px}
    .msg:before{content:"";display:inline-block;vertical-align:middle;margin-right:8px;width:5px;height:5px;border-radius:50%;background:#85e6d9;box-shadow:0 0 8px #85e6d9}
    .meta{display:flex;justify-content:space-between;gap:9px;padding:18px 2px 0;margin-top:21px;border-top:1px solid #283f4d}
    .meta div{min-width:0}
    .meta strong{display:block;color:#deeaf0;font:700 17px var(--mono);margin-top:7px}
    .meta small{display:block;color:#7694a4;font:9px var(--mono);letter-spacing:1.15px;text-transform:uppercase;white-space:nowrap}
    .foot{border-top:1px solid #213443;background:#0a1520bb;color:#577487;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:12px 27px;font:9px var(--mono);letter-spacing:.7px}
    .foot span:last-child{color:#789fa4}
    .adjustments{display:flex;gap:9px;margin-top:12px}
    .adjustments button{flex:1;border:1px solid #2b515d;background:#122b36;color:#b9ebed;border-radius:8px;padding:10px;cursor:pointer;font:700 12px var(--mono)}
    .adjustments button:hover{background:#1b4650}
    @media(max-width:375px){body{padding:10px}.inner{padding:21px 19px 17px}.foot{padding:12px 19px}.timeinput{font-size:27px}.status{font-size:8px}.result{font-size:55px}}
    @media(max-height:535px){body{align-items:flex-start;padding-top:10px;padding-bottom:10px}.rule{margin:16px 0 19px}.out{margin-top:19px}.meta{margin-top:14px}.inner{padding-top:19px;padding-bottom:15px}}
  </style>
</head>
<body>
  <main class="widget" aria-label="FLEX CTRL Mini arbetstidskalkylator">
    <section class="inner">
      <header class="head">
        <div class="brand">
          <div class="logo" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.6"/><path d="M12 7v5l3.7 2.3"/><path d="M12 3.4v1.1"/></svg>
          </div>
          <div><div class="brandtxt">FLEX<span>/CTRL</span></div><div class="edition">MINI EDITION / 01</div></div>
        </div>
        <div class="status"><span class="dot"></span>OFFLINE</div>
      </header>
      <div class="rule"></div>
      <label for="start" class="sectionlabel"><span><span class="step">01</span> &nbsp; STARTTID</span><span>HH:MM</span></label>
      <div class="inputrow">
        <input class="timeinput" id="start" type="text" inputmode="numeric" maxlength="5" value="07:30" placeholder="HH:MM" autocomplete="off" spellcheck="false" aria-label="Starttid i 24-timmarsformat">
        <button class="nowbtn" type="button" id="now" title="Använd nuvarande klockslag">NU</button>
      </div>
      <div class="adjustments"><button type="button" id="minus">− 5 min</button><button type="button" id="plus">+ 5 min</button></div>
      <div class="out" aria-live="polite" aria-atomic="true">
        <div class="outtop"><span>BERÄKNAD HEMGÅNG</span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14m-6-6 6 6-6 6"/></svg></div>
        <div class="result" id="finish">16:10</div>
        <div class="msg" id="note">Då kan du gå hem</div>
      </div>
      <div class="meta" aria-label="Beräkningsinställningar">
        <div><small>ARBETSTID</small><strong>08:00</strong></div>
        <div><small>LUNCH</small><strong>00:40</strong></div>
        <div><small>TOTALT</small><strong>08:40</strong></div>
      </div>
    </section>
    <footer class="foot"><span>LOCAL TIME / 24H</span><span>●&nbsp; <span id="pwa-status">SYSTEM READY</span></span></footer>
  </main>
  <script src="./state.js"></script>
  <script src="./app.js"></script>
</body>
</html>
